name: Release

# Publishes a GitHub release when a v* tag is pushed.
#
# Pipeline:
#   1. gate    — the full CI matrix (typecheck · lint · build · 400 unit tests
#                at 100% coverage · smoke/api-matrix/MCP/websocket e2e) runs on
#                the exact tag commit. A release is cut only if everything is
#                green.
#   2. publish — rebuilds the standalone server, stages a self-hostable
#                distributable (server + MCP adapter + market-data relay +
#                Prisma schema + docs), zips it, checksums it, and publishes
#                the GitHub release with the artifact attached.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Gate · full CI matrix on the release tag
    uses: ./.github/workflows/ci.yml

  publish:
    name: Package & publish GitHub release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Version guard (tag must match package.json)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}"
            exit 1
          fi
          echo "Releasing Meridian Exchange ${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Production build (standalone)
        run: npm run build

      - name: Stage distributable
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGE="dist/meridian-exchange-${VERSION}"
          mkdir -p "$STAGE"

          # Prebuilt standalone server (includes .next/static, public and the
          # traced node_modules produced by `npm run build`).
          cp -a .next/standalone/. "$STAGE/"

          # Dependency-free MCP adapter (Claude Desktop / Claude Code / Cursor).
          cp -a mcp "$STAGE/mcp"

          # Socket.IO market-data relay (source only; operator runs npm ci).
          mkdir -p "$STAGE/mini-services"
          cp -a mini-services/market-relay "$STAGE/mini-services/market-relay"
          rm -rf "$STAGE/mini-services/market-relay/node_modules"

          # Schema + docs needed to bootstrap and operate the install.
          mkdir -p "$STAGE/prisma"
          cp prisma/schema.prisma "$STAGE/prisma/schema.prisma"
          cp README.md LICENSE .env.example "$STAGE/"

          cat > "$STAGE/RELEASE.md" <<'EOF'
          # Meridian Exchange — standalone build

          Prebuilt server (Linux x64). No build step required — Node.js 20.9+ only.

          ## Run it

              export DATABASE_URL="file:$(pwd)/exchange.db"   # absolute path is safest:
                                                              # the standalone Prisma client
                                                              # resolves relative SQLite URLs
                                                              # against this directory
              npx prisma db push --accept-data-loss           # one-time: creates exchange.db
              PORT=3000 node server.js                        # start the exchange

          - Web terminal:  http://localhost:3000
          - REST API:      http://localhost:3000/api/v1  (machine docs at /api/v1/docs)
          - Operator:      http://localhost:3000/?ops=1  (set MRX_OPERATOR_KEY first)

          ## Trading with an AI agent over MCP

          Create an account in the terminal (or `POST /api/v1/auth/register`) to get
          your `mrx_live_` API key, then point the MCP adapter at it:

              MRX_API_KEY=mrx_live_... node mcp/server.mjs

          ## Live WebSocket streaming (optional)

              cd mini-services/market-relay
              npm ci
              npx tsx index.ts          # serves ws://localhost:3003

          and point the browser at it via `NEXT_PUBLIC_MRX_STREAM_URL`.

          ## Configuration

          See `.env.example` (DATABASE_URL, MRX_OPERATOR_KEY,
          NEXT_PUBLIC_MRX_STREAM_URL). On macOS/Windows, build from source
          instead: `npm ci && npx prisma generate && npm run build && npm start`.
          EOF

      - name: Zip distributable + checksums
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cd dist
          zip -qr "meridian-exchange-${VERSION}-standalone.zip" "meridian-exchange-${VERSION}"
          sha256sum "meridian-exchange-${VERSION}-standalone.zip" > SHA256SUMS.txt
          unzip -t "meridian-exchange-${VERSION}-standalone.zip" > /dev/null
          ls -la

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Meridian Exchange ${{ github.ref_name }}
          body: |
            **Meridian Exchange ${{ github.ref_name }}** — a realistic, self-hosted simulated stock market for testing AI trading agents.

            - 48 securities (42 operating companies · 6 sector ETFs) across 9 sectors, continuous 24/7 sessions, daily bars back to each issuer's listing date
            - Full REST trading API (`/api/v1`), L2 order books, LULD halts, earnings engine, news wire, margin & fees, leaderboard
            - MCP adapter for Claude Desktop / Claude Code / Cursor
            - Socket.IO market-data relay for live terminal streaming
            - Verified by the full CI matrix before publishing: typecheck · lint · build · 400 unit tests at 100% coverage · smoke / api-matrix / MCP / websocket conformance suites

            ## Attachments

            | file | purpose |
            |------|---------|
            | `meridian-exchange-${{ github.ref_name }}-standalone.zip` | prebuilt server (Linux x64) — unzip, `npx prisma db push`, `DATABASE_URL=... node server.js`; see `RELEASE.md` inside |
            | `SHA256SUMS.txt` | sha256 checksum of the archive |

            On macOS/Windows build from source: `npm ci && npx prisma generate && npm run build && npm start`.
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/meridian-exchange-${{ github.ref_name }}-standalone.zip
            dist/SHA256SUMS.txt
