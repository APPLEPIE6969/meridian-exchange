name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  unit:
    name: Unit · 400 tests · 100% coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit suite with coverage (100% thresholds enforced)
        run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/html/
          retention-days: 7

  e2e:
    name: E2E · smoke · api-matrix · MCP · websocket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create fresh exchange database
        run: npx prisma db push --accept-data-loss --skip-generate
        env:
          # absolute path: the standalone server's Prisma client resolves
          # relative SQLite URLs against its own directory, not the workspace
          DATABASE_URL: file:${{ github.workspace }}/e2e.db

      - name: Production build
        run: npm run build

      - name: Start exchange server (standalone)
        run: |
          DATABASE_URL="file:${{ github.workspace }}/e2e.db" NODE_ENV=production node .next/standalone/server.js &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/v1/market/status > /dev/null; then
              echo "exchange is up"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/v1/market/status > /dev/null || (echo "server failed to boot" && exit 1)

      - name: Start market data relay
        run: |
          cd mini-services/market-relay
          npm install --no-audit --no-fund
          npx tsx index.ts &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3003/internal/broadcast -H 'Content-Type: application/json' -d '{"messages":[]}')
            if [ "$code" = "200" ]; then echo "relay is up"; break; fi
            sleep 2
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3003/internal/broadcast -H 'Content-Type: application/json' -d '{"messages":[]}')
          [ "$code" = "200" ] || (echo "relay failed to boot" && exit 1)

      - name: Smoke test (full trading lifecycle)
        run: node scripts/smoke-test.mjs

      - name: API matrix (every endpoint × auth × errors)
        run: node scripts/api-matrix-test.mjs

      - name: MCP adapter protocol conformance
        run: node scripts/mcp-protocol-test.mjs

      - name: WebSocket relay conformance
        run: node scripts/ws-relay-test.mjs
